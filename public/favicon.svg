<svg viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Dải gradient xanh dương hiện đại -->
        <linearGradient id="music4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#1d4ed8"/>
        </linearGradient>
    </defs>

    <!-- Vòng tròn nền -->
    <circle cx="120" cy="120" r="115" fill="url(#music4Grad)"/>

    <!-- 4 Vạch sóng âm (Music4) được nghiêng 12 độ tạo cảm giác chuyển động -->
    <g transform="rotate(12, 120, 120)">
        <!-- Sóng 1 (Ngắn) -->
        <path d="M 75 85 Q 90 102.5 75 120 T 75 155"
              stroke="white" stroke-width="16" stroke-linecap="round" fill="none"/>

        <!-- Sóng 2 (Dài) -->
        <path d="M 105 60 Q 125 90 105 120 T 105 180"
              stroke="white" stroke-width="16" stroke-linecap="round" fill="none"/>

        <!-- Sóng 3 (Dài) -->
        <path d="M 135 60 Q 155 90 135 120 T 135 180"
              stroke="white" stroke-width="16" stroke-linecap="round" fill="none"/>

        <!-- Sóng 4 (Ngắn) -->
        <path d="M 165 85 Q 180 102.5 165 120 T 165 155"
              stroke="white" stroke-width="16" stroke-linecap="round" fill="none"/>
    </g>
</svg>
